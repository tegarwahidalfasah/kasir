# ===========================================================================
#  nginx sebagai proxy (bila sudah ada nginx di server). TLS tetap butuh domain
#  publik (Let's Encrypt) atau sertifikat internal Anda sendiri.
#  Simpan: /etc/nginx/sites-available/kasir && ln -s ../sites-available/kasir /etc/nginx/sites-enabled/
# Tambahkan sekali di blok http{} /etc/nginx/nginx.conf:
#   limit_req_zone $binary_remote_addr zone=kasir_api:10m rate=20r/s;
# ===========================================================================
server {
    listen 443 ssl http2;
    server_name kasir.tokoanda.com;

    ssl_certificate     /etc/letsencrypt/live/kasir.tokoanda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasir.tokoanda.com/privkey.pem;

    client_max_body_size 12m;              # upload logo (data URL) ikut express.json limit

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # jangan pernah sajikan berkas DB / cadangan
    location ~* \.(sqlite|sqlite-wal|sqlite-shm|env)$ { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # loginGuard memakai req.ip -> X-Forwarded-For harus benar (app.set('trust proxy', true))
        limit_req zone=kasir_api burst=20 nodelay;
    }
}

server {
    listen 80;
    server_name kasir.tokoanda.com;
    return 301 https://$host$request_uri;
}
